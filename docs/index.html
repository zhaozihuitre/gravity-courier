<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>引力信使 · Gravity Courier</title>
<style>
:root {
  --bg: #05080f;
  --panel: rgba(13, 19, 34, 0.92);
  --line: #24304f;
  --text: #e9eef8;
  --muted: #8d99b6;
  --gold: #ffcf6b;
  --cyan: #6be3ff;
  --red: #ff5a6a;
  --font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Hiragino Sans GB", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: var(--font); user-select: none; -webkit-user-select: none; overscroll-behavior: none;
}
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hidden { display: none !important; }

button { font-family: inherit; }
.btn {
  appearance: none; border: 1px solid var(--line); background: rgba(20, 28, 48, 0.9); color: var(--text);
  border-radius: 12px; padding: 12px 22px; font-size: 16px; font-weight: 600; cursor: pointer;
  transition: transform .12s, border-color .12s, background .12s;
}
.btn:hover { border-color: #3d4d78; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #1d1500; }
.btn.primary:hover { background: #ffd987; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.small { padding: 7px 14px; font-size: 14px; border-radius: 9px; }

/* HUD */
#hud {
  position: fixed; top: 0; left: 0; right: 0; height: 54px; padding: 8px max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  display: flex; align-items: center; justify-content: space-between; gap: 10px; pointer-events: none;
}
#hud > * { pointer-events: auto; }
.hud-left, .hud-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hud-title { min-width: 0; }
#lvTitle { font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#lvSub { font-size: 12px; color: var(--muted); white-space: nowrap; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: rgba(13, 19, 34, 0.75);
  display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--text);
}
.icon-btn:hover { border-color: #3d4d78; }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.help-btn {
  height: 38px; border-radius: 10px; border: 1px solid rgba(123, 227, 160, .6); background: rgba(20, 50, 36, .8); color: #9ff0bf;
  display: flex; align-items: center; gap: 4px; padding: 0 10px 0 8px; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 700;
  animation: helpPulse 2s ease infinite;
}
.help-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.help-btn:disabled { opacity: .5; animation: none; cursor: default; }
.help-btn.on, .help-btn.on:disabled { opacity: 1; background: #7be3a0; color: #062012; border-color: #7be3a0; }
@keyframes helpPulse { 50% { box-shadow: 0 0 14px rgba(123, 227, 160, .45); } }
@media (max-height: 480px) { .help-btn { height: 32px; } }
@media (max-width: 760px) { .help-btn span { display: none; } .help-btn { padding: 0 9px; } }
.help-btn:not(:disabled):active svg { transform: scale(.85); }
.help-btn svg { transition: transform .1s; }
#btnScope.on svg { animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.fire.wait { background: #1d2844; color: #9ff0bf; border: 1px solid rgba(123, 227, 160, .5); box-shadow: none; font-size: 14px; letter-spacing: 0; white-space: nowrap; }
#ammo { display: flex; gap: 5px; align-items: center; }
#ammo i {
  display: block; width: 9px; height: 20px; border-radius: 5px; background: var(--gold);
  box-shadow: 0 0 8px rgba(255, 207, 107, .6);
}
#ammo i.used { background: #26304a; box-shadow: none; }
#ammo i.par { outline: 1px dashed rgba(255, 207, 107, .55); outline-offset: 2px; }

#toast {
  position: fixed; left: 50%; top: 18%; transform: translateX(-50%); pointer-events: none;
  font-size: clamp(15px, 3.6vw, 26px); font-weight: 800; letter-spacing: .06em; text-shadow: 0 0 18px rgba(0,0,0,.8);
  white-space: nowrap;
  animation: toast 1.8s ease forwards;
}
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 10px); } 15%, 70% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
#fastHint {
  position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  font-size: 12px; color: var(--muted); pointer-events: none; background: rgba(13,19,34,.7); padding: 4px 10px; border-radius: 99px;
}

/* 瞄准控制：横屏在右侧一列，竖屏在底部一行 */
#controls {
  position: fixed; right: 0; top: 56px; bottom: 0; width: 120px;
  padding: 10px max(10px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) 10px;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; touch-action: none;
}
.ctl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: center; }
.ctl-label { grid-column: 1 / -1; font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.ctl-val { grid-column: 1 / -1; text-align: center; font-size: 13px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.ctl {
  height: 44px; border-radius: 12px; border: 1px solid var(--line); background: rgba(13, 19, 34, 0.85); color: var(--text);
  display: grid; place-items: center; cursor: pointer; padding: 0; touch-action: none;
}
.ctl:active { background: #1d2844; border-color: var(--gold); }
.ctl svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.fire {
  height: 64px; border-radius: 18px; border: none; background: var(--gold); color: #1d1500; font-size: 18px; font-weight: 800;
  letter-spacing: .1em; cursor: pointer; box-shadow: 0 0 24px rgba(255, 207, 107, .35); touch-action: none; font-family: inherit;
  transition: transform .1s, background .1s;
}
.fire:active { transform: scale(.96); }
.fire.flying { background: #1d2844; color: var(--cyan); box-shadow: none; border: 1px solid var(--line); font-size: 15px; }
.fire.go { background: #7be3a0; color: #062012; box-shadow: 0 0 28px rgba(123, 227, 160, .7); animation: goPulse .4s ease infinite alternate; }
@keyframes goPulse { to { transform: scale(1.04); } }
#controls.busy .ctl, #controls.busy .ctl-val { opacity: .35; }
body.portrait #controls {
  top: auto; left: 0; width: auto; height: 118px; flex-direction: row; align-items: stretch; justify-content: center;
  padding: 8px max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
body.portrait .ctl-row { flex: 1; max-width: 130px; align-content: center; }
body.portrait .fire { flex: 1.1; max-width: 150px; height: auto; }
@media (max-height: 480px) {
  #controls { top: 44px; gap: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  .ctl { height: 38px; }
  .fire { height: 52px; }
}

/* 全屏页 */
.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; }
.title-box { text-align: center; max-width: 520px; }
.kicker { font-size: 12px; letter-spacing: .4em; color: var(--cyan); }
h1 {
  font-size: clamp(48px, 11vw, 92px); margin: 6px 0 4px; font-weight: 900; letter-spacing: .08em;
  background: linear-gradient(180deg, #fff6dc 10%, #ffcf6b 60%, #ff9a4a); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 24px rgba(255, 180, 80, .35));
}
.tagline { color: var(--muted); margin: 0 0 28px; font-size: 16px; }
.menu { display: flex; flex-direction: column; gap: 12px; width: min(280px, 80vw); margin: 0 auto; }
.howto { margin-top: 26px; font-size: 13px; color: #6c7795; }

.select-box { width: min(980px, 100%); max-height: 100%; overflow-y: auto; padding: 4px 2px 20px; }
.select-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; position: sticky; top: 0; background: linear-gradient(var(--bg) 75%, transparent); padding: 6px 0 12px; z-index: 1; }
.select-head h2 { margin: 0; font-size: 22px; flex: 1; }
#starTotal { color: var(--gold); font-weight: 700; }
.chapter { margin-bottom: 18px; }
.chapter-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.chapter-head b { font-size: 16px; }
.chapter-head span { font-size: 13px; color: var(--muted); }
.lv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.lv {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 12px;
  padding: 12px 10px; text-align: left; cursor: pointer; min-height: 78px; transition: border-color .12s, transform .12s;
}
.lv:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-1px); }
.lv:disabled { opacity: .4; cursor: not-allowed; }
.lv .no { font-size: 12px; color: var(--muted); }
.lv .nm { display: block; font-weight: 700; font-size: 15px; margin: 2px 0 4px; }
.lv .st { font-size: 13px; letter-spacing: 2px; color: #2b3552; }
.lv .st b { color: var(--gold); font-weight: 400; }

/* 弹窗 */
.overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(3, 5, 10, .45); }
.card {
  width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px;
  text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: pop .25s ease;
}
@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
.card-kicker { font-size: 12px; letter-spacing: .2em; color: var(--cyan); }
.card h3 { margin: 6px 0 10px; font-size: 26px; }
.card p { color: #c9d2e6; font-size: 15px; line-height: 1.7; margin: 8px 0; }
.card-foot { margin-top: 16px; font-size: 13px; color: var(--muted); animation: blink 1.6s ease infinite; }
@keyframes blink { 50% { opacity: .4; } }
.card-btns { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.card-btns.col { flex-direction: column; }
.stars { font-size: 44px; letter-spacing: 8px; margin: 4px 0; color: #2b3552; }
.stars span { display: inline-block; }
.stars span.on { color: var(--gold); text-shadow: 0 0 16px rgba(255, 207, 107, .7); animation: star .45s cubic-bezier(.3, 1.6, .5, 1) backwards; }
@keyframes star { from { transform: scale(0) rotate(-40deg); } }

@media (max-width: 700px) {
  .lv-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-height: 480px) {
  #hud { height: 44px; padding-top: 4px; }
  .icon-btn { width: 32px; height: 32px; }
  #lvTitle { font-size: 14px; }
  h1 { font-size: 48px; }
  .tagline { margin-bottom: 14px; }
  .menu { gap: 8px; }
  .btn { padding: 9px 18px; }
  .howto { margin-top: 12px; }
}

/* 物理小卡片 */
.card { max-height: calc(100% - 24px); overflow-y: auto; }
.card.phys { width: min(520px, 100%); text-align: left; border-color: rgba(107, 227, 255, .35); }
.card.phys h3 { margin-top: 4px; }
.formula {
  font-family: "Cambria Math", "STIX Two Math", "Times New Roman", serif; font-size: 20px; text-align: center;
  padding: 10px 12px; margin: 6px 0 12px; border-radius: 10px; background: rgba(107, 227, 255, .08); color: #bdf3ff;
  border: 1px solid rgba(107, 227, 255, .2); overflow-x: auto; white-space: nowrap;
}
.pc-body p { margin: 0 0 10px; }
.real { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: rgba(255, 207, 107, .08); border-left: 3px solid var(--gold); }
.real b { font-size: 12px; letter-spacing: .1em; color: var(--gold); }
.real p { margin: 4px 0 0; font-size: 14px; }
.card.phys .card-btns { justify-content: flex-end; }
.chapter-head { flex-wrap: wrap; }
.card-link {
  margin-left: auto; appearance: none; border: 1px solid rgba(107, 227, 255, .45); background: rgba(107, 227, 255, .08);
  color: var(--cyan); border-radius: 8px; padding: 3px 10px; font-size: 12px; font-family: inherit; cursor: pointer;
}
.card-link:hover { background: rgba(107, 227, 255, .16); }

/* 英文界面用西文字体（中文字体里的标点和字距不适合英文） */
html[lang="en"] { --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
html[lang="en"] body, html[lang="en"] button { font-family: var(--font); }

</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- 游戏内 HUD。data-i18n / data-i18n-aria 的文字由 js/i18n.js 按当前语言填入 -->
<div id="hud" class="hidden">
  <div class="hud-left">
    <button class="icon-btn" id="btnPause" data-i18n-aria="ariaMenu">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="hud-title">
      <div id="lvTitle"></div>
      <div id="lvSub"></div>
    </div>
  </div>
  <div id="ammo" data-i18n-aria="ariaAmmo"></div>
  <div class="hud-right">
    <button class="help-btn hidden" id="btnAwacs" data-i18n-aria="ariaAwacs">
      <svg viewBox="0 0 24 24"><path d="M12 3c.9 0 1.5.7 1.5 1.6V9l7.5 4.5V16l-7.5-2.3v4.1l2 1.5V21L12 20l-3.5 1v-1.7l2-1.5v-4.1L3 16v-2.5L10.5 9V4.6C10.5 3.7 11.1 3 12 3z"/></svg>
      <span data-i18n="awacsLabel"></span>
    </button>
    <button class="help-btn hidden" id="btnScope" data-i18n-aria="ariaScope">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.6"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/></svg>
      <span data-i18n="scopeLabel"></span>
    </button>
    <button class="icon-btn" id="btnRestart" data-i18n-aria="ariaRestart">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>
    </button>
    <button class="icon-btn" id="btnMute" data-i18n-aria="ariaSound"></button>
  </div>
</div>
<div id="toast" class="hidden"></div>
<div id="fastHint" class="hidden" data-i18n="fastHint"></div>

<!-- 瞄准控制：拖动画面粗调，按钮微调，点发射 -->
<div id="controls" class="hidden">
  <div class="ctl-row">
    <span class="ctl-label" data-i18n="angle"></span>
    <button class="ctl" id="angDown" data-i18n-aria="ariaAngDown">
      <svg viewBox="0 0 24 24"><path d="M9 4H4v5M4.6 9A8 8 0 1 1 6 17"/></svg>
    </button>
    <button class="ctl" id="angUp" data-i18n-aria="ariaAngUp">
      <svg viewBox="0 0 24 24"><path d="M15 4h5v5M19.4 9A8 8 0 1 0 18 17"/></svg>
    </button>
    <span class="ctl-val" id="roAng">0.0°</span>
  </div>
  <div class="ctl-row">
    <span class="ctl-label" data-i18n="power"></span>
    <button class="ctl" id="powDown" data-i18n-aria="ariaPowDown">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
    </button>
    <button class="ctl" id="powUp" data-i18n-aria="ariaPowUp">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>
    </button>
    <span class="ctl-val" id="roPow">50%</span>
  </div>
  <button id="btnFire" class="fire"></button>
</div>

<!-- 标题 -->
<section id="title" class="screen">
  <div class="title-box">
    <div class="kicker" data-i18n="kicker"></div>
    <h1 data-i18n="title"></h1>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="menu">
      <button class="btn primary" id="btnPlay"></button>
      <button class="btn" id="btnSelect" data-i18n="selectBtn"></button>
      <button class="btn ghost" id="btnLangTitle" data-i18n="lang"></button>
      <button class="btn ghost" id="btnMuteTitle"></button>
      <button class="btn ghost" id="btnVibeTitle"></button>
    </div>
    <p class="howto" data-i18n="howto"></p>
  </div>
</section>

<!-- 选关 -->
<section id="select" class="screen hidden">
  <div class="select-box">
    <div class="select-head">
      <button class="btn small" id="btnBackTitle" data-i18n="back"></button>
      <h2 data-i18n="selectTitle"></h2>
      <div id="starTotal"></div>
    </div>
    <div id="chapters"></div>
  </div>
</section>

<!-- 关卡介绍 -->
<section id="intro" class="overlay hidden">
  <div class="card">
    <div class="card-kicker" id="introNo"></div>
    <h3 id="introName"></h3>
    <p id="introTip"></p>
    <div class="card-foot" data-i18n="introFoot"></div>
  </div>
</section>

<!-- 结算 -->
<section id="result" class="overlay hidden">
  <div class="card">
    <div class="card-kicker" id="resNo"></div>
    <h3 id="resTitle"></h3>
    <div class="stars" id="resStars"></div>
    <p id="resInfo"></p>
    <div class="card-btns" id="resBtns"></div>
  </div>
</section>

<!-- 物理小卡片（盖在结算和选关页上面） -->
<section id="physCard" class="overlay hidden">
  <div class="card phys">
    <div class="card-kicker" id="pcKicker"></div>
    <h3 id="pcTitle"></h3>
    <div class="formula" id="pcFormula"></div>
    <div class="pc-body" id="pcBody"></div>
    <div class="real">
      <b id="pcRealLabel" data-i18n="cardReal"></b>
      <p id="pcReal"></p>
    </div>
    <div class="card-btns"><button class="btn primary" id="pcOk" data-i18n="cardOk"></button></div>
  </div>
</section>

<!-- 暂停 -->
<section id="pause" class="overlay hidden">
  <div class="card">
    <h3 data-i18n="pauseTitle"></h3>
    <div class="card-btns col">
      <button class="btn primary" id="btnResume" data-i18n="resume"></button>
      <button class="btn" id="btnPauseRestart" data-i18n="restartLevel"></button>
      <button class="btn" id="btnPauseSelect" data-i18n="selectLevel"></button>
      <button class="btn" id="btnPauseLang" data-i18n="lang"></button>
      <button class="btn" id="btnPauseVibe"></button>
      <button class="btn ghost" id="btnPauseTitle" data-i18n="backTitle"></button>
    </div>
  </div>
</section>

<script>
/* 引力信使 · 多语言（中文 / English）
 * t(key, params) 取当前语言的文字，{name} 会被 params 里的值替换。
 * 关卡和章节的英文名、提示放在 LEVEL_EN / CHAPTER_EN 里（关卡数据本身保持中文，求解器不需要文字）。
 */
(function (root) {
  'use strict';
  const STR = {
    zh: {
      title: '引力信使', kicker: 'GRAVITY COURIER',
      tagline: '以引力为弓，猎杀星海里的海盗船',
      play: '开始游戏', selectBtn: '选择关卡',
      howto: '拖拽瞄准 · 点「发射」 · 借行星引力让鱼雷拐弯',
      lang: '语言：中文',
      soundOn: '声音：开', soundOff: '声音：关', vibeOn: '震动：开', vibeOff: '震动：关',
      back: '← 返回', selectTitle: '选择关卡',
      introFoot: '点击任意处开始',
      pauseTitle: '暂停', resume: '继续', restartLevel: '重来本关', selectLevel: '选择关卡', backTitle: '回到标题',
      fastHint: '按住屏幕或「加速」键 3 倍速',
      angle: '角度', power: '力度', fire: '发射',
      ariaMenu: '菜单', ariaRestart: '重来', ariaSound: '声音', ariaAmmo: '剩余鱼雷',
      ariaAngDown: '逆时针微调角度', ariaAngUp: '顺时针微调角度', ariaPowDown: '减小力度', ariaPowUp: '增大力度',
      awacsLabel: '预警机', scopeLabel: '自动瞄准',
      ariaAwacs: '呼叫预警机：显示完整辅助线（本次最多 2 星）', ariaScope: '自动瞄准（本次最多 1 星）',

      replay1: '重玩第 1 关', startGame: '开始游戏', continueLv: '继续 · 第 {lv} 关',
      chapterHead: '第 {n} 章 · {name}', locked: '未解锁',
      introNo: '第 {lv} 关 · 第 {n} 章「{ch}」',
      hudSub: '海盗 {a}/{t} · 三星 ≤ {shots}',
      holdSpeed: '按住加速', locking: '锁定中…', fireIn: '{s} 秒后发射', fireNow: '现在发射！',
      early: '早了 {s} 秒', late: '晚了 {s} 秒',

        body: ['碰撞前后，系统的总动量不变。弹性碰撞里，总动能也不变。',

<script>
/* 引力信使 · 物理核心
 * 游戏、预测线、求助和关卡求解器（tools/solve.js）共用这一份代码，保证结果一致。
 * 世界坐标固定为 1600 x 900，固定步长积分，同样的输入永远得到同样的轨迹。
 *
 * 一次发射是一个 shot：里面可能有多枚鱼雷（潮汐撕裂会一分为二），
 * 被撞飞的小行星（puck）记在 state 里，也会接着飞，直到全部停下这次发射才结束。
 * 调用方式：每一步先 state.t += DT，再 stepShot(level, state, shot, DT, events)。
 */
(function (root) {
  'use strict';
  const W = 1600, H = 900;
  const G = 3200;                 // 行星质量 = G * r^2 * 密度
  const DT = 1 / 240;             // 固定步长
  const MAX_SPEED = 720;          // 满力度发射速度（px/s）
  const MAX_TIME = 10;            // 鱼雷/被撞飞的小行星最长飞行时间
  const SHIELD_HALF = 70 * Math.PI / 180;
  const SHIELD_GAP = 14;          // 护盾弧离船体的距离
  const CIV_R = 26;               // 民用货船的碰撞半径
  const TORP_MASS = 1;            // 鱼雷质量（和可推动小行星做弹性碰撞时用）
  const KINDS = {
    scout: { r: 22, hp: 1 },
    shield: { r: 26, hp: 1 },
    boss: { r: 58, hp: 3 },
  };

  const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

  // 命中半径：前期关卡的海盗船更大（level.hitScale），母舰不缩放
  function radius(level, kind) {
    return KINDS[kind].r * (kind === 'boss' ? 1 : (level.hitScale || 1));
  }

  // 位置：静止物体直接用 x,y；会动的按 move 描述随时间计算（行星、海盗、民船都适用）
  function entPos(e, t) {
    const m = e.move;
    if (!m) return [e.x, e.y];
    if (m.type === 'orbit') {
      const a = (m.phase || 0) * Math.PI / 180 + m.w * t;
      return [m.cx + Math.cos(a) * m.R, m.cy + Math.sin(a) * m.R];
    }
    // line：在 a、b 两点之间平滑往返
    const s = 0.5 - 0.5 * Math.cos((t / m.period + (m.phase || 0)) * 2 * Math.PI);
    return [m.ax + (m.bx - m.ax) * s, m.ay + (m.by - m.ay) * s];
  }

  // 护盾朝向（弧度）。没写 face 的护盾舰始终朝向玩家。
  function faceOf(level, p, t) {
    if (p.face !== undefined) return (p.face + (p.spin || 0) * t) * Math.PI / 180;
    const [x, y] = entPos(p, t);
    return Math.atan2(level.launch[1] - y, level.launch[0] - x);
  }

  function muPlanet(p) { return G * p.r * p.r * (p.d || 1); }
  function muHole(h) { return G * h.m; }

  // 引力加速度。t 用于计算公转中的行星位置（引力弹弓）。
  function accel(level, x, y, t) {
    let ax = 0, ay = 0;
    const add = (px, py, mu) => {
      const dx = px - x, dy = py - y, d2 = dx * dx + dy * dy + 100, d = Math.sqrt(d2), a = mu / d2;
      ax += a * dx / d; ay += a * dy / d;
    };
    for (const p of level.planets || []) { const [px, py] = entPos(p, t || 0); add(px, py, muPlanet(p)); }
    for (const h of level.holes || []) add(h.x, h.y, muHole(h));
    for (const q of level.repulsors || []) add(q.x, q.y, -G * q.m);   // 斥力星：负质量，把鱼雷推开
    return [ax, ay];
  }

  function createState(level) {
    return {
      t: 0,
      pirates: (level.pirates || []).map((p, i) => ({
        i, kind: p.kind || 'scout', hp: p.hp || KINDS[p.kind || 'scout'].hp, alive: true,
      })),
      // 可以被鱼雷撞动的小行星（动量碰撞）
      pucks: (level.pucks || []).map(p => ({ x: p.x, y: p.y, vx: 0, vy: 0, r: p.r, m: p.m || 2, alive: true, moving: false, age: 0 })),
    };
  }
  function cloneState(st) {
    return { t: st.t, pirates: st.pirates.map(p => ({ ...p })), pucks: st.pucks.map(p => ({ ...p })) };
  }

  function launchVel(angle, power) {
    return [Math.cos(angle) * MAX_SPEED * power, Math.sin(angle) * MAX_SPEED * power];
  }
  const mkTorp = (x, y, vx, vy) => ({ x, y, vx, vy, age: 0, cool: 0, split: false, done: false, end: null });
  function newShot(level, angle, power) {
    const [vx, vy] = launchVel(angle, power);
    return { torps: [mkTorp(level.launch[0], level.launch[1], vx, vy)] };
  }

  /* ───────── 共用的碰撞判定 ───────── */
  // 反射镜：本步位移线段穿过镜面就反弹（两面都能反射）
  function reflect(level, ox, oy, b, events) {
    for (const m of level.mirrors || []) {
      const rx = b.x - ox, ry = b.y - oy, sx = m.bx - m.ax, sy = m.by - m.ay;
      const den = rx * sy - ry * sx;
      if (Math.abs(den) < 1e-9) continue;
      const qx = m.ax - ox, qy = m.ay - oy;
      const u = (qx * sy - qy * sx) / den, v = (qx * ry - qy * rx) / den;
      if (u < 0 || u > 1 || v < 0 || v > 1) continue;
      const len = Math.hypot(sx, sy), nx = -sy / len, ny = sx / len;
      const dot = b.vx * nx + b.vy * ny;
      b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny;
      const ix = ox + rx * u, iy = oy + ry * u;
      const side = (ox - ix) * nx + (oy - iy) * ny >= 0 ? 1 : -1;
      b.x = ix + nx * side * 0.5; b.y = iy + ny * side * 0.5;
      if (events) events.push({ type: 'bounce', x: ix, y: iy });
      return true;
    }
    return false;
  }
  // 撞上不可破坏的天体。pr 是撞击物自身的半径（鱼雷为 0）。
  function hitSolid(level, t, x, y, pr) {
    for (const p of level.planets || []) { const [px, py] = entPos(p, t); if (Math.hypot(x - px, y - py) < p.r + pr) return 'planet'; }
    for (const h of level.holes || []) if (Math.hypot(x - h.x, y - h.y) < h.r + pr) return 'hole';
    for (const r of level.rocks || []) if (Math.hypot(x - r.x, y - r.y) < r.r + pr) return 'rock';
    for (const q of level.repulsors || []) if (Math.hypot(x - q.x, y - q.y) < q.r + pr) return 'planet';
    return null;
  }
  const outOfBounds = (x, y) => x < -300 || x > W + 300 || y < -300 || y > H + 300;
  function hitCiv(level, state, x, y, pr, events) {
    for (const c of level.civs || []) {
      const [cx, cy] = entPos(c, state.t);
      if (Math.hypot(x - cx, y - cy) < CIV_R + pr) { events.push({ type: 'civ', x: cx, y: cy }); return 'civ'; }
    }
    return null;
  }
  // 海盗：小船被穿透，护盾正面会挡，母舰会吞掉撞击物
  function hitPirates(level, state, x, y, pr, events, by) {
    for (const ps of state.pirates) {
      if (!ps.alive) continue;
      const p = level.pirates[ps.i], r = radius(level, ps.kind) + pr;
      const [px, py] = entPos(p, state.t);
      const d = Math.hypot(x - px, y - py);
      if (d > r + SHIELD_GAP + 2) continue;
      if (ps.kind !== 'scout') {
        const diff = angDiff(Math.atan2(y - py, x - px), faceOf(level, p, state.t));
        if (d < r + SHIELD_GAP && Math.abs(diff) < SHIELD_HALF) {
          events.push({ type: 'block', x, y, i: ps.i });
          return 'blocked';
        }
      }
      if (d < r) {
        ps.hp--;
        if (ps.hp <= 0) { ps.alive = false; events.push({ type: 'kill', i: ps.i, x: px, y: py, by }); }
        else events.push({ type: 'bosshit', i: ps.i, x, y, by });
        if (ps.kind === 'boss') return 'absorbed';
      }
    }
    return null;
  }
  // 弹性碰撞（动量守恒 + 动能守恒），沿连心线交换动量
  function collide(a, ma, b, mb) {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, nx = dx / d, ny = dy / d;
    const vrel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    if (vrel <= 0) return 0;
    const J = 2 * vrel / (1 / ma + 1 / mb);
    a.vx -= J / ma * nx; a.vy -= J / ma * ny;
    b.vx += J / mb * nx; b.vy += J / mb * ny;
    return J;
  }

  /* 推进一枚鱼雷一步。返回 null 表示继续飞，否则返回结束原因。
   * events 为 null 时是「普通预测线」：不判定海盗、民船，可推动的小行星当作障碍物。 */
  function stepTorpedo(level, state, tp, dt, events, shot) {
    const t = state.t;
    const [ax, ay] = accel(level, tp.x, tp.y, t);
    const ox = tp.x, oy = tp.y;
    tp.vx += ax * dt; tp.vy += ay * dt;
    // 磁场：带电鱼雷受洛伦兹力，速度方向以角速度 w 旋转、速率不变（速度越快，圆弧越大）
    for (const f of level.fields || []) {
      if (Math.hypot(tp.x - f.x, tp.y - f.y) < f.r) {
        const a = f.w * dt, c = Math.cos(a), s = Math.sin(a), vx = tp.vx;
        tp.vx = vx * c - tp.vy * s; tp.vy = vx * s + tp.vy * c;
      }
    }
    tp.x += tp.vx * dt; tp.y += tp.vy * dt;
    tp.age += dt; tp.cool -= dt;

    reflect(level, ox, oy, tp, events);

    if (tp.cool <= 0) {
      for (const w of level.worms || []) {
        const ends = [[w.a, w.b], [w.b, w.a]];
        let warped = false;
        for (const [a, b] of ends) {
          if (Math.hypot(tp.x - a[0], tp.y - a[1]) < w.r) {
            tp.x = b[0] + (tp.x - a[0]); tp.y = b[1] + (tp.y - a[1]);
            tp.cool = 0.35; warped = true;
            if (events) events.push({ type: 'warp', from: a, to: b });
            break;
          }
        }
        if (warped) break;
      }
    }

    // 潮汐撕裂：进入天体的洛希半径（tidal）后，鱼雷被撕成两枚，向两侧张开
    if (!tp.split && shot) {
      for (const b of [...(level.planets || []), ...(level.holes || [])]) {
        if (!b.tidal) continue;
        const [bx, by] = entPos(b, t);
        if (Math.hypot(tp.x - bx, tp.y - by) < b.tidal) {
          const a = (b.spread || 18) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
          const t2 = mkTorp(tp.x, tp.y, tp.vx * c + tp.vy * s, -tp.vx * s + tp.vy * c);
          const vx = tp.vx; tp.vx = vx * c - tp.vy * s; tp.vy = vx * s + tp.vy * c;
          tp.split = t2.split = true; t2.age = tp.age; t2.cool = tp.cool;
          shot.torps.push(t2);
          if (events) events.push({ type: 'split', x: tp.x, y: tp.y });
          break;
        }
      }
    }

    const solid = hitSolid(level, t, tp.x, tp.y, 0);
    if (solid) return solid;
    if (outOfBounds(tp.x, tp.y)) return 'lost';
    if (tp.age > MAX_TIME) return 'timeout';

    // 可推动的小行星：弹性碰撞，把动量传给它（鱼雷会被弹回一部分）
    for (const pk of state.pucks) {
      if (!pk.alive) continue;
      const d = Math.hypot(pk.x - tp.x, pk.y - tp.y);
      if (d >= pk.r) continue;
      if (!events) return 'rock';
      const J = collide(tp, TORP_MASS, pk, pk.m);
      if (J > 0) { pk.moving = true; events.push({ type: 'push', x: tp.x, y: tp.y }); }
      const nx = (tp.x - pk.x) / (d || 1), ny = (tp.y - pk.y) / (d || 1);
      tp.x = pk.x + nx * (pk.r + 0.5); tp.y = pk.y + ny * (pk.r + 0.5);
    }

    if (!events) return null;
    return hitCiv(level, state, tp.x, tp.y, 0, events) || hitPirates(level, state, tp.x, tp.y, 0, events, 'torp');
  }

  // 被撞飞的小行星：受引力（不受磁场影响，它不带电），会被镜面反弹，撞到海盗会击毁它
  function stepPuck(level, state, pk, dt, events) {
    const [ax, ay] = accel(level, pk.x, pk.y, state.t);
    const ox = pk.x, oy = pk.y;
    pk.vx += ax * dt; pk.vy += ay * dt;
    pk.x += pk.vx * dt; pk.y += pk.vy * dt; pk.age += dt;
    reflect(level, ox, oy, pk, events);
    // 撞上其他小行星：继续传递动量（牛顿摆）
    for (const o of state.pucks) {
      if (o === pk || !o.alive) continue;
      if (Math.hypot(o.x - pk.x, o.y - pk.y) < o.r + pk.r && collide(pk, pk.m, o, o.m) > 0) {
        o.moving = true;
        if (events) events.push({ type: 'push', x: (o.x + pk.x) / 2, y: (o.y + pk.y) / 2 });
      }
    }
    let end = hitSolid(level, state.t, pk.x, pk.y, pk.r) || (outOfBounds(pk.x, pk.y) ? 'lost' : null) || (pk.age > MAX_TIME ? 'timeout' : null);
    if (!end && events) end = hitCiv(level, state, pk.x, pk.y, pk.r, events) || hitPirates(level, state, pk.x, pk.y, pk.r, events, 'puck');
    if (end) {
      pk.moving = false; pk.alive = false;
      if (events) events.push({ type: 'puckend', reason: end, x: pk.x, y: pk.y });
    }
  }

  /* 推进整次发射一步。返回 true 表示这次发射已经全部结束（所有鱼雷和被撞飞的小行星都停了）。
   * 每枚鱼雷结束时追加 {type:'end', reason, x, y, k}。 */
  function stepShot(level, state, shot, dt, events) {
    const n = shot.torps.length;      // 本步刚撕裂出的鱼雷从下一步开始飞
    for (let k = 0; k < n; k++) {
      const tp = shot.torps[k];
      if (tp.done) continue;
      const r = stepTorpedo(level, state, tp, dt, events, shot);
      if (r) { tp.done = true; tp.end = r; if (events) events.push({ type: 'end', reason: r, x: tp.x, y: tp.y, k }); }
    }
    for (const pk of state.pucks) if (pk.moving) stepPuck(level, state, pk, dt, events);
    return shot.torps.every(tp => tp.done) && !state.pucks.some(pk => pk.moving);
  }

  // 完整模拟一次发射（求解器、自动瞄准用）。返回事件列表和是否打到民船。
  function simulate(level, state, angle, power, onStep) {
    const shot = newShot(level, angle, power), events = [];
    let done = false;
    while (!done) {
      state.t += DT;
      done = stepShot(level, state, shot, DT, events);
      if (onStep) onStep(shot, state);
    }
    return { events, shot, civ: events.some(e => e.type === 'civ') };
  }

  const api = { W, H, G, DT, MAX_SPEED, MAX_TIME, SHIELD_HALF, SHIELD_GAP, CIV_R, KINDS,
    entPos, faceOf, accel, radius, createState, cloneState, launchVel, newShot, stepShot, stepTorpedo, simulate,
    angDiff, muPlanet, muHole };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Physics = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 引力信使 · 关卡数据
 * 坐标系 1600 x 900。launch 为信使号位置；ammo 为鱼雷数；par 为三星所需的发射次数。
 * planets{x,y,r,d?,hue}  holes{x,y,m,r}  rocks{x,y,r}  worms{a:[x,y],b:[x,y],r}
 * repulsors{x,y,r,m}（斥力星）  mirrors{ax,ay,bx,by}（反射镜）  civs{x,y,move?}（民用货船，打到即失败）
 * planets 也可以带 move（公转，引力弹弓）；planets/holes 带 tidal（洛希半径）和 spread（撕裂张角，度）
 * fields{x,y,r,w}（磁场，w 为鱼雷速度方向的旋转角速度，正为顺时针）  pucks{x,y,r,m}（可撞动的小行星）
 * pirates{x,y,kind:'scout'|'shield'|'boss',face?,spin?,hp?,move?}
 *   move: {type:'line',ax,ay,bx,by,period,phase?} | {type:'orbit',cx,cy,R,w,phase?(度)}
 * 每一关都用 tools/solve.js 验证过可解。
 */
(function (root) {
  'use strict';
  const CHAPTERS = [
    { name: '初次狩猎', desc: '借行星的引力把鱼雷「拐」过去' },
    { name: '碎石带', desc: '小行星会拦下鱼雷，找到缝隙' },
    { name: '巡逻舰队', desc: '会动的海盗、会挡的护盾' },
    { name: '奇点', desc: '黑洞与虫洞' },

/* 引力信使 · 音效（Web Audio 实时合成，不需要音频文件） */
(function (root) {
  'use strict';
  const Sfx = {
    ctx: null, master: null, noiseBuf: null, muted: false,
    init() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.5;
        this.master.connect(this.ctx.destination);
        const len = this.ctx.sampleRate;
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { this.ctx = null; }
    },
    setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.5; },
    tone(freq, dur, type = 'sine', vol = 0.3, slideTo = null, delay = 0) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
    },
    noise(dur, vol = 0.4, freq = 1000, delay = 0) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime + delay;
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
      const f = this.ctx.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.05);
    },
    launch() { this.tone(560, 0.28, 'triangle', 0.18, 150); this.noise(0.22, 0.12, 2400); },
    boom(big) { this.noise(big ? 1.2 : 0.55, big ? 0.7 : 0.45, big ? 700 : 1400); this.tone(big ? 80 : 150, big ? 0.9 : 0.4, 'sine', 0.4, 35); },
    hit() { this.noise(0.3, 0.35, 1800); this.tone(240, 0.25, 'square', 0.08, 90); },
    block() { this.tone(1500, 0.16, 'square', 0.07, 900); this.tone(2300, 0.14, 'sine', 0.08); },
    fizzle() { this.noise(0.3, 0.16, 700); },
    swallow() { this.tone(300, 0.6, 'sine', 0.22, 40); },
    warp() { this.tone(220, 0.35, 'sine', 0.2, 1300); this.tone(330, 0.35, 'triangle', 0.08, 1900, 0.04); },
    win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.32, 'triangle', 0.16, null, i * 0.1)); },
    fail() { [392, 330, 262].forEach((f, i) => this.tone(f, 0.38, 'triangle', 0.15, null, i * 0.15)); },
    star(i) { this.tone(700 * Math.pow(1.26, i), 0.3, 'triangle', 0.14); },
    click() { this.tone(880, 0.05, 'square', 0.04); },
    // 预警机：引擎轰鸣 + 两声雷达扫描音
    radar() { this.noise(3.4, 0.12, 500); this.tone(90, 3.4, 'sawtooth', 0.04, 70); [0.4, 1.4, 2.4].forEach(d => this.tone(1200, 0.45, 'sine', 0.1, 600, d)); },
    // 瞄准镜：搜索时的嘀嘀声
    scope() { [0, 0.12, 0.24].forEach(d => this.tone(1800, 0.05, 'square', 0.04, null, d)); },
    // 锁定：上扬的双音
    lock() { this.tone(1000, 0.09, 'square', 0.06); this.tone(1500, 0.18, 'square', 0.06, null, 0.1); },
    bounce() { this.tone(2400, 0.08, 'sine', 0.08, 1600); },
    // 潮汐撕裂：撕开的噪声 + 一分为二的双音
    split() { this.noise(0.25, 0.25, 3000); this.tone(700, 0.25, 'triangle', 0.1, 1100); this.tone(700, 0.25, 'triangle', 0.1, 450); },
    // 撞动小行星：低沉的闷响
    thud() { this.tone(120, 0.22, 'sine', 0.35, 55); this.noise(0.15, 0.25, 600); },
  };
  root.Sfx = Sfx;
})(window);

<script>
/* 引力信使 · 游戏主逻辑：场景、输入、渲染、存档 */
(() => {
  'use strict';
  const { W, H, DT, KINDS, SHIELD_HALF, SHIELD_GAP } = Physics;

  const TAU = Math.PI * 2;
  const $ = id => document.getElementById(id);

  const save = { stars: {}, muted: false };
  try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* 无痕模式等情况下忽略 */ }
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* 忽略 */ } };
  const unlockAll = /[?&]all\b/.test(location.search);

  const unlocked = id => unlockAll || id === 1 || starsOf(id - 1) > 0;
  Sfx.setMuted(!!save.muted);

  /* ───────── 画布与视图 ───────── */
  const canvas = $('game');

  }
  /* ───────── 物理小卡片 ───────── */

  // 手机震动（Android 浏览器支持；iOS Safari 没有震动接口，会静默忽略）

  }

  }
  function toggleVibe() { save.noVibe = !save.noVibe; persist(); vibeLabel(); if (!save.noVibe) buzz(40); }
  function toast(text, color = '#e9eef8') {

  /* ───────── 关卡运行 ───────── */
  function startLevel(id, restart) {

    [ui.title, ui.select, ui.result, ui.pause, ui.card].forEach(e => show(e, false));
    show(ui.hud, true); show(ui.controls, true);

        pts: Array.from({ length: n }, (_, k) => { const a = k / n * TAU, rr = r.r * (0.82 + rnd() * 0.3); return [r.x + Math.cos(a) * rr, r.y + Math.sin(a) * rr]; }),
        craters: Array.from({ length: 2 }, () => [r.x + (rnd() - 0.5) * r.r, r.y + (rnd() - 0.5) * r.r, r.r * (0.12 + rnd() * 0.12)]),

  function setAim(angle, power) {

  }
  function refreshControls() {
    if (!game) return;

      if (game.tick < s) { label = T('fireIn', { s: ((s - game.tick) * DT).toFixed(1) }); state = 'wait'; }
      else if (game.tick <= e) { label = T('fireNow'); state = 'go'; }
    } else if (!game.torp && game.predHit) state = 'go';     // 预警机辅助线显示能命中
    fire.textContent = label;

    fire.classList.toggle('go', state === 'go');
  }
  function fire() {
    if (!canAim() || game.aimP < 0.06) return;
    if (timedHint()) {

      if (game.tick < s) toast(T('early', { s: ((s - game.tick) * DT).toFixed(1) }), '#ffcf6b');

  // 玩家自己改了瞄准：自动瞄准给出的航线就不再成立
  const userAim = () => { game.touched = true; game.aimTween = null; if (game.hint) { game.hint = null; refreshHelp(); } };
  function nudgeAngle(deg) { if (canAim()) { userAim(); setAim(game.aimA + deg * Math.PI / 180, game.aimP); } }
  function nudgePower(d) { if (canAim()) { userAim(); setAim(game.aimA, Math.round((game.aimP + d) * 100) / 100); } }

  /* ───────── 求助（默认可用）─────────
   * 呼叫预警机（飞机图标）：辅助线延长成完整轨迹，并把海盗一起算进去，能命中时线变绿。瞄准仍由玩家调。本次最多 2 星。
   * 自动瞄准（瞄准镜图标）：现场算出一条能命中的航线并设好瞄准；移动目标会提示发射时机。发射仍由玩家按。本次最多 1 星。 */
  const HELP_AFTER = 0;   // 改成 3 则需要同一关失败 3 次后才出现
  const failsOf = id => (save.fails && save.fails[id]) || 0;
  const timedHint = () => !!(game && game.hint && game.hint.win && !game.torp);
  function refreshHelp() {
    const on = !!game && !game.done && failsOf(game.id) >= HELP_AFTER;
    const a = $('btnAwacs'), s = $('btnScope');
    show(a, on); show(s, on);
    if (!on) return;
    const aiming = game.phase === 'aim' && !game.torp;
    a.disabled = game.fullLine; a.classList.toggle('on', game.fullLine);
    s.disabled = game.searching || !!game.hint || !aiming;
    s.classList.toggle('on', game.searching || !!game.hint);
  }
  function callAwacs() {
    const g = game;
    if (!g || g.done || g.fullLine) return;
    g.fullLine = true; g.capStars = Math.min(g.capStars, 2); g.awacsT = 0;
    refreshHelp(); Sfx.radar();
    toast(T('awacsArrived'), '#9ff0bf');
  }

  // 模拟一次发射；record 为 true 时返回所有鱼雷和被撞飞小行星的完整轨迹（穿过虫洞处断开）。打到民船的一发不算。
  function simShot(L, base, t0, angle, power, record) {
    const st = Physics.cloneState(base); st.t = t0;
    const paths = record ? [[[L.launch[0], L.launch[1]]]] : null, ppaths = [];
    let n = 0;
    const r = Physics.simulate(L, st, angle, power, record ? (shot, s2) => {
      if (++n % 2) return;
      shot.torps.forEach((tp, k) => {
        if (tp.rec) return;
        const p = paths[k] || (paths[k] = []), last = p[p.length - 1];
        if (last && Math.hypot(tp.x - last[0], tp.y - last[1]) > 100) p.push(null);
        p.push([tp.x, tp.y]); if (tp.done) tp.rec = true;
      });
      s2.pucks.forEach((pk, k) => { if (pk.moving) (ppaths[k] || (ppaths[k] = [])).push([pk.x, pk.y]); });
    } : null);
    const hits = r.civ ? [] : r.events.filter(e => e.type === 'kill' || e.type === 'bosshit');
    let path = null;
    if (record) { path = []; for (const q of [...paths, ...ppaths]) if (q) { if (path.length) path.push(null); path.push(...q); } }
    return { score: hits.length, path, marks: hits.map(e => [e.x, e.y]) };
  }
  async function autoAim() {
    const g = game;
    if (!g || g.done || g.searching || g.hint || g.phase !== 'aim' || g.torp) return;
    g.searching = true; g.drag = null; g.aimTween = null;
    g.scope = { t: 0, lock: -1, target: null };
    refreshHelp(); refreshControls(); Sfx.scope();
    const L = g.L, moving = L.pirates.some(p => p.move || p.spin) || (L.civs || []).some(c => c.move) || (L.planets || []).some(p => p.move);
    const t = g.st.t, tick = g.tick;      // 计算期间世界时间冻结，算出的发射时机才准
    // 移动目标：至少留 1.5 秒给玩家看倒计时，并挑一个发射时间窗口够宽的航线
    const MIN_LEAD = Math.round(1.2 / DT), WANT = 0.4;
    const waits = moving ? Array.from({ length: 26 }, (_, i) => 1.5 + i * 0.25) : [0];
    const hitAt = (a, p, k) => simShot(L, g.st, t + k * DT, a, p).score > 0;
    const timeWindow = (a, p, k) => {
      const s = 6; let lo = k, hi = k;
      while (k - lo < 240 && lo - s >= MIN_LEAD && hitAt(a, p, lo - s)) lo -= s;
      while (hi - k < 240 && hitAt(a, p, hi + s)) hi += s;
      return [lo, hi];
    };
    const powers = [];
    for (let p = 0.2; p <= 1.0001; p += 0.05) powers.push(+p.toFixed(2));
    powers.sort((a, b) => Math.abs(a - 0.55) - Math.abs(b - 0.55));
    const started = performance.now();
    let found = null, n = 0;
    search: for (const w of waits) {
      const k = Math.round(w / DT), t0 = t + k * DT;
      // 从「直接指向海盗」的方向开始，往两边逐度扩展
      const bases = g.st.pirates.filter(p => p.alive).map(ps => {
        const [x, y] = Physics.entPos(L.pirates[ps.i], t0);
        return Math.atan2(y - L.launch[1], x - L.launch[0]);
      });
      for (let d = 0; d <= 180; d++) for (const b of bases) for (const sgn of d ? [1, -1] : [1]) {
        const a = b + sgn * d * Math.PI / 180;
        for (const p of powers) {
          if (hitAt(a, p, k)) {
            if (!moving) { found = { a, p, k }; break search; }
            const [lo, hi] = timeWindow(a, p, k), len = (hi - lo) * DT;
            if (!found || len > found.len) found = { a, p, k: Math.round((lo + hi) / 2), len };
            if (len >= WANT) break search;
          }
          if (++n % 120 === 0) {
            await new Promise(r => setTimeout(r));
            if (game !== g || g.done) return;
          }
          if (found && n > 20000) break search;     // 找不到够宽的窗口就用目前最好的
        }
      }
    }
    if (!found) {
      g.searching = false; g.scope = null; refreshHelp(); refreshControls();
      toast(T('noRoute'), '#ff9b7e');
      return;
    }
    found.t0 = t + found.k * DT;
    // 取命中范围的中间值，留出容错
    const ok = (a, p) => simShot(L, g.st, found.t0, a, p).score > 0;
    const da = 0.1 * Math.PI / 180, lim = 6 * Math.PI / 180;
    let lo = found.a, hi = found.a;
    while (found.a - lo < lim && ok(lo - da, found.p)) lo -= da;
    while (hi - found.a < lim && ok(hi + da, found.p)) hi += da;
    const a = (lo + hi) / 2;
    let plo = found.p, phi = found.p;
    while (found.p - plo < 0.25 && plo - 0.01 >= 0.1 && ok(a, plo - 0.01)) plo -= 0.01;
    while (phi - found.p < 0.25 && phi + 0.01 <= 1 && ok(a, phi + 0.01)) phi += 0.01;
    let p = Math.round((plo + phi) * 50) / 100;
    if (!ok(a, p)) p = found.p;
    const shot = simShot(L, g.st, found.t0, a, p, true);
    let win = null;
    if (moving) {
      let [wlo, whi] = timeWindow(a, p, found.k);
      if (whi - wlo > 24) { wlo += 6; whi -= 6; }      // 边界只精确到 6 步，往里收一点保险
      win = [tick + wlo, tick + whi];
    }
    // 让瞄准镜的搜索动画至少播 0.7 秒，再锁定
    const wait = 700 - (performance.now() - started);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    if (game !== g || g.done) return;
    g.searching = false; g.capStars = 1; g.touched = true;
    g.hint = { angle: a, power: p, path: shot.path, marks: shot.marks, win };
    g.scope = { t: 0, lock: 0, target: shot.marks[0] };
    g.aimTween = { a0: g.aimA, p0: g.aimP, a1: a, p1: p, t: 0 };
    refreshHelp(); refreshControls(); Sfx.lock();
    toast(T(moving ? 'lockedMoving' : 'lockedStatic'), '#9ff0bf');
  }
  function launch(angle, power) {
    const g = game, L = g.L;
    g.torp = Physics.newShot(L, angle, power);     // 一次发射：可能撕裂成多枚鱼雷
    g.torp.torps[0].trail = [[L.launch[0], L.launch[1]]]; g.ptrails = [];
    g.used++; g.angle = angle; g.lastAim = { angle, power }; g.combo = 0;
    g.predHit = false; g.hint = null; g.scope = null;
    g.phase = 'fly';
    for (let i = 0; i < 14; i++) {
      const a = angle + rand(-0.5, 0.5), v = rand(60, 220);
      g.parts.push({ x: L.launch[0], y: L.launch[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.2, 0.45), max: 0.45, c: '#ffd88a', s: 3 });
    }
    Sfx.launch(); updateHud(); refreshControls(); refreshHelp();
    if (g.used === 1 && !save.seenFast) { show(ui.fast, true); }
  }
  function explode(x, y, big, hue = 0) {
    const g = game, n = big ? 90 : 40;
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), v = rand(40, big ? 420 : 260);
      g.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, big ? 1.6 : 1), max: big ? 1.6 : 1,
        c: Math.random() < 0.5 ? '#ffb46b' : hsl(hue, 90, 65), s: rand(2, 5) });
    }
    g.rings.push({ x, y, r0: 10, r1: big ? 220 : 110, t: 0, dur: big ? 0.8 : 0.5, c: '255,190,120' });
    g.shake = Math.max(g.shake, big ? 1.8 : 0.9);
  }
  function addFloat(x, y, text, color, size = 22) { game.floats.push({ x, y, text, color, size, t: 0 }); }

  function handleEvents(evs) {
    const g = game;
    for (const e of evs) {
      if (e.type === 'kill') {
        const kind = g.st.pirates[e.i].kind;
        explode(e.x, e.y, kind === 'boss', 355);
        Sfx.boom(kind === 'boss');
        buzz(kind === 'boss' ? [120, 50, 160, 50, 220] : g.combo >= 1 ? [50, 30, 70] : 60);
        g.combo++;
        if (g.combo === 2) addFloat(e.x, e.y - 80, T('doubleKill'), '#ffcf6b', 26);
        else if (g.combo >= 3) addFloat(e.x, e.y - 80, T('combo', { n: g.combo }), '#ffcf6b', 30);
        else addFloat(e.x, e.y - 40, kind === 'boss' ? T('bossDown') : T('kill'), '#ff8a7a', kind === 'boss' ? 32 : 18);
        updateHud();

      } else if (e.type === 'bosshit') {
        const p = g.st.pirates[e.i];
        explode(e.x, e.y, false, 20); Sfx.hit(); buzz([70, 40, 70]);
        addFloat(e.x, e.y - 30, T('bossHit', { hp: p.hp }), '#ff8a7a', 20);
      } else if (e.type === 'block') {
        for (let i = 0; i < 26; i++) {
          const a = rand(0, TAU), v = rand(80, 300);
          g.parts.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.2, 0.6), max: 0.6, c: '#9ff0ff', s: 2.5 });
        }

      } else if (e.type === 'bounce') {
        g.rings.push({ x: e.x, y: e.y, r0: 4, r1: 34, t: 0, dur: 0.3, c: '220,230,255' });
        for (let i = 0; i < 10; i++) {
          const a = rand(0, TAU), v = rand(60, 200);
          g.parts.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.15, 0.35), max: 0.35, c: '#e8eeff', s: 2 });
        }

        explode(e.x, e.y, false, 200); Sfx.boom(false); buzz([150, 60, 150, 60, 150]);
        addFloat(e.x, e.y - 40, T('civHit'), '#7fc8ff', 26);

        }
      } else if (e.type === 'split') {
        g.rings.push({ x: e.x, y: e.y, r0: 6, r1: 70, t: 0, dur: 0.45, c: '255,150,110' });
        for (let i = 0; i < 24; i++) {
          const a = rand(0, TAU), v = rand(80, 260);
          g.parts.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.2, 0.5), max: 0.5, c: '#ffb08a', s: 2.5 });
        }
        addFloat(e.x, e.y - 34, T('split'), '#ffb08a', 22);

      } else if (e.type === 'push') {
        g.rings.push({ x: e.x, y: e.y, r0: 6, r1: 46, t: 0, dur: 0.35, c: '255,210,150' });
        for (let i = 0; i < 16; i++) {
          const a = rand(0, TAU), v = rand(60, 220);
          g.parts.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.2, 0.5), max: 0.5, c: '#e8c39a', s: 3 });
        }
        g.shake = Math.max(g.shake, 0.5); Sfx.thud(); buzz(35);
      } else if (e.type === 'puckend') {
        if (e.reason !== 'lost' && e.reason !== 'timeout') { explode(e.x, e.y, false, 30); Sfx.fizzle(); buzz(25); }
      } else if (e.type === 'end') {
        torpEnd(e);
      } else if (e.type === 'warp') {
        g.rings.push({ x: e.from[0], y: e.from[1], r0: 50, r1: 4, t: 0, dur: 0.4, c: '200,150,255' });
        g.rings.push({ x: e.to[0], y: e.to[1], r0: 4, r1: 60, t: 0, dur: 0.45, c: '120,230,255' });

      }
    }
  }
  // 一枚鱼雷结束（可能还有别的鱼雷或被撞飞的小行星在飞）
  function torpEnd(e) {
    const g = game, tp = g.torp && g.torp.torps[e.k];
    if (tp && tp.trail) tp.trail.push([e.x, e.y]);
    if (e.reason === 'planet' || e.reason === 'rock') { explode(e.x, e.y, false, 30); g.shake = Math.max(g.shake, 0.5); Sfx.fizzle(); buzz(25); }
    else if (e.reason === 'hole') { g.rings.push({ x: e.x, y: e.y, r0: 40, r1: 2, t: 0, dur: 0.5, c: '255,170,90' }); Sfx.swallow(); }
    else if (e.reason === 'lost' || e.reason === 'timeout') { if (!g.outcome) addFloat(clamp(e.x, 80, W - 80), clamp(e.y, 80, H - 80), T('lostTorp'), '#8d99b6', 18); }
  }
  // 记录轨迹（穿过虫洞时断开）
  function trackTrails(g) {
    for (const tp of g.torp.torps) {
      if (!tp.trail) tp.trail = [[tp.x, tp.y]];
      if (tp.done) continue;
      const last = tp.trail[tp.trail.length - 1];
      if (last && Math.hypot(tp.x - last[0], tp.y - last[1]) > 100) tp.trail.push(null);
      tp.trail.push([tp.x, tp.y]);
    }
    g.st.pucks.forEach((pk, k) => { if (pk.moving) (g.ptrails[k] || (g.ptrails[k] = [])).push([pk.x, pk.y]); });
  }
  // 整次发射结束
  function finishShot() {
    const g = game, ghost = [];
    for (const tr of [...g.torp.torps.map(tp => tp.trail), ...g.ptrails]) if (tr) { if (ghost.length) ghost.push(null); ghost.push(...tr); }
    g.ghost = ghost; g.torp = null; g.ptrails = []; g.fast = false; g.combo = 0;
    show(ui.fast, false);
    if (!g.outcome) {
      if (g.used >= g.L.ammo) {

        save.fails = save.fails || {}; save.fails[g.id] = failsOf(g.id) + 1; persist();

  function finish() {

    const resBtns = $('resBtns'); resBtns.innerHTML = '';

    $('resNo').textContent = T('resNo', { lv: lvLabel(L), name: I18N.lvName(L) });

    if (g.outcome === 'win') {

      let info = last ? T('allClearInfo', { n: g.used })
        : g.capStars < 3 ? T('helpedInfo', { tool: T(g.capStars === 1 ? 'toolScope' : 'toolAwacs'), cap: g.capStars, shots: I18N.shots(L.par) })
        : T('usedInfo', { n: g.used, shots: I18N.shots(L.par) }) + (stars < 3 ? T('tryBetter') : '');
      if (first && L.id < LEVELS.length && LEVELS[L.id].ch !== L.ch) info += '\n' + T('newChapter', { ch: I18N.chName(CHAPTERS[LEVELS[L.id].ch], LEVELS[L.id].ch) });
      $('resInfo').textContent = info;
      Sfx.win();
      for (let i = 0; i < stars; i++) setTimeout(() => Sfx.star(i), 300 + i * 180);
      if (!last) btn(T('next'), 'primary', () => startLevel(L.id + 1, false));
      btn(T('replay'), '', () => startLevel(L.id, true));
      if (chLast && CARDS[L.ch]) btn(T('cardBtn'), '', () => showCard(L.ch, false));
      btn(T(last ? 'viewAll' : 'levels'), last ? 'primary' : 'ghost', goSelect);
      // 一章第一次通关：自动弹出这一章的物理小卡片
      if (chLast && CARDS[L.ch] && !(save.cards && save.cards[L.ch])) {

      }
    } else {

      $('resStars').innerHTML = '';
      const canHelp = failsOf(L.id) >= HELP_AFTER;

  function updatePlay(dt) {
    const g = game;
    if (g.paused) return;
    const speed = g.torp && g.fast ? 3 : 1;
    g.acc += dt * speed;
    let steps = 0;
    if (g.searching) g.acc = 0;          // 自动瞄准计算期间冻结世界时间，算出的时机才准
    while (g.acc >= DT && steps < 1000) {
      g.acc -= DT; steps++;
      g.st.t += DT; g.tick++;
      if (g.torp) {
        const evs = [];
        const finished = Physics.stepShot(g.L, g.st, g.torp, DT, evs);

    const step = 46;
    for (let gx = f.x - f.r + step / 2; gx < f.x + f.r; gx += step) for (let gy = f.y - f.r + step / 2; gy < f.y + f.r; gy += step) {
      if (Math.hypot(gx - f.x, gy - f.y) > f.r - 10) continue;
      ctx.beginPath(); ctx.arc(gx, gy, 6, 0, TAU); ctx.stroke();
      if (cw) { ctx.beginPath(); ctx.moveTo(gx - 4, gy - 4); ctx.lineTo(gx + 4, gy + 4); ctx.moveTo(gx + 4, gy - 4); ctx.lineTo(gx - 4, gy + 4); ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(gx, gy, 1.8, 0, TAU); ctx.fill(); }
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(190,140,255,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    // 两段旋转箭头
    const dir = cw ? 1 : -1, r = f.r * 0.62;
    ctx.strokeStyle = 'rgba(220,190,255,0.75)'; ctx.lineWidth = 3;
    for (let i = 0; i < 2; i++) {
      const a0 = dir * t * 0.8 + i * Math.PI, a1 = a0 + dir * 1.6;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, Math.min(a0, a1), Math.max(a0, a1)); ctx.stroke();
      const hx = f.x + Math.cos(a1) * r, hy = f.y + Math.sin(a1) * r, ta = a1 + dir * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(hx, hy); ctx.lineTo(hx - Math.cos(ta - 0.5) * 12, hy - Math.sin(ta - 0.5) * 12);
      ctx.moveTo(hx, hy); ctx.lineTo(hx - Math.cos(ta + 0.5) * 12, hy - Math.sin(ta + 0.5) * 12);
      ctx.stroke();
    }
  }
  // 洛希极限：进入这个圈，鱼雷会被潮汐力撕成两枚
  function drawRoche(b, t) {
    const [x, y] = Physics.entPos(b, game.st.t);
    ctx.strokeStyle = `rgba(255,140,110,${0.45 + 0.2 * Math.sin(t * 3)})`; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
    ctx.lineDashOffset = -t * 15;
    ctx.beginPath(); ctx.arc(x, y, b.tidal, 0, TAU); ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
  }
  // 可推动的小行星：暖色，带一圈箭头提示「能撞动」
  function drawPuck(pk, shape, t) {
    ctx.save(); ctx.translate(pk.x, pk.y);
    poly(shape.map(([a, k]) => [Math.cos(a) * pk.r * k, Math.sin(a) * pk.r * k]));
    ctx.fillStyle = '#4a3322'; ctx.fill(); ctx.strokeStyle = '#e8b27a'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(pk.r * 0.25, -pk.r * 0.2, pk.r * 0.22, 0, TAU); ctx.fill();
    ctx.restore();
    if (!pk.moving) {
      ctx.strokeStyle = `rgba(232,178,122,${0.35 + 0.2 * Math.sin(t * 3)})`; ctx.lineWidth = 1.5;
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + Math.PI / 4, r0 = pk.r + 8, r1 = pk.r + 16;
        ctx.beginPath(); ctx.moveTo(pk.x + Math.cos(a) * r0, pk.y + Math.sin(a) * r0); ctx.lineTo(pk.x + Math.cos(a) * r1, pk.y + Math.sin(a) * r1); ctx.stroke();
      }
    }
  }

  function drawPrediction(g) {
    const angle = g.aimA, power = g.aimP, L = g.L;
    // 普通模式：只看前 preview 秒，不判定海盗。
    // 预警机模式：一直算到这次发射结束，把海盗、民船、被撞飞的小行星都模拟进去，看此刻发射能不能命中。
    const full = g.fullLine;
    const span = Math.round((L.preview || 0.9) / DT);
    const steps = full ? Math.ceil(Physics.MAX_TIME / DT) * 2 : span;
    const st = Physics.cloneState(g.st);          // 本地副本推进时间（公转的行星会动），不影响真实状态
    const shot = Physics.newShot(L, angle, power);
    const evs = full ? [] : null, pts = [];
    let done = false;
    for (let i = 1; i <= steps && !done; i++) {
      st.t += DT;
      done = Physics.stepShot(L, st, shot, DT, evs);
      if (i % 8 === 0 || done) {
        for (const tp of shot.torps) if (!tp.done || !tp.mark) { pts.push([tp.x, tp.y, i, 0]); if (tp.done) tp.mark = 1; }
        for (const pk of st.pucks) if (pk.moving) pts.push([pk.x, pk.y, i, 1]);
      }
    }
    const civ = full && evs.some(e => e.type === 'civ');
    const hits = full && !civ ? evs.filter(e => e.type === 'kill' || e.type === 'bosshit') : [];
    const hit = hits.length > 0;
    if (full && hit !== !!g.predHit) { g.predHit = hit; refreshControls(); }
    // 预警机刚到时，辅助线随雷达扫描逐步显现
    const reveal = full ? awacsReveal(g) : 1;
    ctx.save();
    if (reveal < 1) { ctx.beginPath(); ctx.rect(-400, -400, 400 + (W + 120) * reveal - 60, H + 800); ctx.clip(); }
    for (const [x, y, i, isPuck] of pts) {
      const f = full ? 0.75 : Math.max(0, 1 - i / span);
      ctx.fillStyle = isPuck ? `rgba(255,190,120,${0.35 + 0.6 * f})`
        : hit ? `rgba(123,227,160,${0.35 + 0.6 * f})` : `rgba(255,232,170,${0.25 + 0.7 * f})`;
      ctx.beginPath(); ctx.arc(x, y, full ? 3 : 2.6 + 1.8 * f, 0, TAU); ctx.fill();
    }
    if (hit) {
      ctx.strokeStyle = 'rgba(123,227,160,0.9)'; ctx.lineWidth = 3; ctx.setLineDash([6, 5]);
      for (const e of hits) { ctx.beginPath(); ctx.arc(e.x, e.y, 36, 0, TAU); ctx.stroke(); }
      ctx.setLineDash([]);
    }
    if (civ) {   // 会打到民船：红圈警告
      const c = evs.find(e => e.type === 'civ');
      ctx.strokeStyle = 'rgba(255,110,110,0.95)'; ctx.lineWidth = 3; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.arc(c.x, c.y, 38, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.strokeStyle = 'rgba(255,120,100,0.9)'; ctx.lineWidth = 2.5;
    for (const tp of shot.torps) {
      if (!tp.done || ['lost', 'timeout', 'civ'].includes(tp.end) || (hit && tp.end === 'absorbed')) continue;
      ctx.beginPath(); ctx.moveTo(tp.x - 7, tp.y - 7); ctx.lineTo(tp.x + 7, tp.y + 7); ctx.moveTo(tp.x + 7, tp.y - 7); ctx.lineTo(tp.x - 7, tp.y + 7); ctx.stroke();
    }
    ctx.restore();
    return { angle, power };
  }

  function renderPlay(t) {
    const g = game, L = g.L;
    worldTransform();
    if (g.shake > 0) ctx.translate(rand(-1, 1) * g.shake * 8, rand(-1, 1) * g.shake * 8);
    // 星区边界
    ctx.strokeStyle = 'rgba(120,150,220,0.10)'; ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, W, H);
    for (const w of L.worms || []) drawWorm(w, t);
    for (const p of L.planets || []) drawPlanet(p, t);
    for (const h of L.holes || []) drawHole(h, t);
    for (const rk of g.rocks) drawRock(rk);
    for (const m of L.mirrors || []) drawMirror(m, t);
    for (const q of L.repulsors || []) drawRepulsor(q, t);
    for (const c of L.civs || []) drawCiv(c, t);
    for (const f of L.fields || []) drawField(f, t);
    for (const b of [...(L.planets || []), ...(L.holes || [])]) if (b.tidal) drawRoche(b, t);
    g.st.pucks.forEach((pk, k) => { if (pk.alive) drawPuck(pk, g.puckShapes[k], t); });
    strokeTrail(g.ghost, 'rgba(220,230,255,0.22)', 1.5, [5, 7]);
    ctx.globalCompositeOperation = 'lighter';
    if (g.torp) for (const tp of g.torp.torps) strokeTrail(tp.trail, 'rgba(255,200,110,0.75)', 2.5);
    for (const tr of g.ptrails) strokeTrail(tr, 'rgba(255,190,120,0.55)', 2, [3, 4]);
    ctx.globalCompositeOperation = 'source-over';
    for (const ps of g.st.pirates) if (ps.alive) drawPirate(ps, t);
    let angle = g.angle, power = 0;
    const aiming = g.phase === 'aim' && !g.torp && !g.outcome;
    if (aiming && g.hint && !g.aimTween) {
      // 自动瞄准算出的航线和命中点
      ctx.globalCompositeOperation = 'lighter';
      strokeTrail(g.hint.path, `rgba(123,227,160,${0.55 + 0.3 * Math.sin(t * 4)})`, 3, [10, 7]);
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = 'rgba(123,227,160,0.8)'; ctx.lineWidth = 2.5; ctx.setLineDash([6, 5]);
      for (const [x, y] of g.hint.marks || []) { ctx.beginPath(); ctx.arc(x, y, 34 + 4 * Math.sin(t * 5), 0, TAU); ctx.stroke(); }
      ctx.setLineDash([]);
    }
    if (aiming) {
      ({ angle, power } = drawPrediction(g));
    }
    drawScope(g, t);
    drawAwacs(g, t);
    drawCourier(L, angle, t);
    if (aiming) {
      const [x, y] = L.launch;
      ctx.strokeStyle = 'rgba(255,207,107,0.35)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, 44, -Math.PI / 2, -Math.PI / 2 + TAU * power); ctx.stroke();
    }
    if (g.torp) for (const tp of g.torp.torps) {
      if (tp.done) continue;
      ctx.globalCompositeOperation = 'lighter';
      glow(tp.x, tp.y, 22, 'rgba(255,220,150,0.85)');
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(tp.x, tp.y, 4.5, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const p of g.parts) {
      ctx.globalAlpha = clamp(p.life / p.max * 1.4, 0, 1); ctx.fillStyle = p.c;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;
    for (const r of g.rings) {
      const f = r.t / r.dur, rr = r.r0 + (r.r1 - r.r0) * f;
      ctx.strokeStyle = `rgba(${r.c},${1 - f})`; ctx.lineWidth = 3 * (1 - f) + 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, Math.max(1, rr), 0, TAU); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';

    // 屏幕空间文字（竖屏旋转时也保持正向）
    screenTransform();
    const sc = clamp(view.s * 1.2, 0.65, 1.2);
    for (const f of g.floats) {
      const [sx, sy] = toScreen(f.x, f.y);
      ctx.globalAlpha = clamp((1.4 - f.t) * 2, 0, 1);
      ctx.font = `800 ${Math.round(f.size * sc)}px ${font()}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(5,8,15,0.8)'; ctx.strokeText(f.text, sx, sy - f.t * 30);
      ctx.fillStyle = f.color; ctx.fillText(f.text, sx, sy - f.t * 30);
    }
    ctx.globalAlpha = 1;
    if (g.drag) {
      ctx.font = `700 13px ${font()}`; ctx.textAlign = 'center'; ctx.fillStyle = '#ffcf6b';
      const [sx, sy] = toScreen(L.launch[0], L.launch[1]);
      ctx.fillText(T('powerPct', { p: Math.round(power * 100) }), sx, sy - 54 * Math.max(0.6, view.s));
    }
    if (aiming && !g.drag && !g.touched && g.used === 0 && L.id <= 2) {
      // 新手提示：在画面中间示范一次拖动
      const cx = view.ox + (view.rot ? H : W) * view.s * 0.5, cy = view.oy + (view.rot ? W : H) * view.s * 0.62;
      const k = (t % 1.8) / 1.8, d = 60 * Math.min(1, k * 1.6);
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx - d, cy + d * 0.4, 10, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.85; ctx.font = `600 14px ${font()}`; ctx.textAlign = 'center'; ctx.fillStyle = '#e9eef8';
      ctx.fillText(T('dragHint'), cx, cy + 50);
      ctx.globalAlpha = 1;
    }
  }

  /* ───────── 渲染：标题背景 ───────── */
  function renderTitleBg(t) {
    screenTransform();
    const S = Math.min(cw, ch), cx = cw * 0.5, cy = ch * 0.5;
    const pr = S * 0.13, px = cx + S * 0.55 > cw ? cx + S * 0.28 : cx + S * 0.55, py = cy + S * 0.18;
    const g = ctx.createRadialGradient(px - pr * 0.4, py - pr * 0.4, 2, px, py, pr);
    g.addColorStop(0, hsl(18, 70, 70, 0.9)); g.addColorStop(1, hsl(18, 60, 18, 0.9));
    ctx.globalCompositeOperation = 'lighter'; glow(px, py, pr * 1.5, 'rgba(255,140,80,0.15)'); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();
    // 一条绕行星甩出去的弧线
    ctx.globalCompositeOperation = 'lighter';
    const k = (t * 0.25) % 1;
    ctx.strokeStyle = 'rgba(255,200,110,0.35)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 80; i++) {
      const u = i / 80 * k;
      const a = Math.PI * 1.1 + u * Math.PI * 1.5, rr = pr * (3.2 - 1.6 * Math.sin(u * Math.PI));
      const x = px + Math.cos(a) * rr, y = py + Math.sin(a) * rr * 0.7;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ───────── 主循环 ───────── */
  let last = performance.now(), clock = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
    if (scene === 'play' && game) updatePlay(dt);
    drawSky(clock);
    if (scene === 'title') renderTitleBg(clock);
    if (scene === 'play' && game) renderPlay(clock);
    requestAnimationFrame(frame);
  }

  /* ───────── 输入 ───────── */
  const pos = e => [e.clientX, e.clientY];
  canvas.addEventListener('pointerdown', e => {
    Sfx.init();
    if (scene !== 'play' || !game || game.paused) return;
    canvas.setPointerCapture(e.pointerId);
    const [x, y] = pos(e);
    if (canAim()) {
      // 从当前瞄准出发做相对调整：手指放哪里都行，不会挡住飞船；触屏灵敏度更低，方便微调
      const m = maxDrag(), [dx, dy] = w2sDir(Math.cos(game.aimA), Math.sin(game.aimA));
      game.drag = { x, y, px: -dx * game.aimP * m, py: -dy * game.aimP * m, gain: e.pointerType === 'mouse' ? 1 : 0.6 };
      game.touched = true;
    } else if (game.torp) fastOn();
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => {
    const d = game && game.drag;
    if (!d || !canAim()) return;
    const [x, y] = pos(e), m = maxDrag();
    let px = d.px + (x - d.x) * d.gain, py = d.py + (y - d.y) * d.gain;
    const len = Math.hypot(px, py);
    if (len > m) { px *= m / len; py *= m / len; }
    if (len > 0.5 && Math.hypot(x - d.x, y - d.y) > 3) {
      userAim();
      const [wx, wy] = s2wDir(-px, -py); setAim(Math.atan2(wy, wx), Math.min(len, m) / m);
    }
  });
  const release = () => { if (game) { game.drag = null; game.fast = false; } };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  ui.intro.addEventListener('pointerdown', e => {
    Sfx.init(); e.preventDefault();
    if (game && game.phase === 'intro') { game.phase = 'aim'; show(ui.intro, false); refreshControls(); refreshHelp(); }
  });
  function fastOn() {
    game.fast = true;
    if (!save.seenFast) { save.seenFast = true; persist(); show(ui.fast, false); }
  }

  // 按住连续触发的微调按钮
  function holdRepeat(el, fn) {
    let t1 = 0, t2 = 0;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); Sfx.init(); stop(); fn();
      t1 = setTimeout(() => { t2 = setInterval(fn, 45); }, 320);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, stop));
  }
  holdRepeat($('angDown'), () => nudgeAngle(-0.5));
  holdRepeat($('angUp'), () => nudgeAngle(0.5));
  holdRepeat($('powDown'), () => nudgePower(-0.01));
  holdRepeat($('powUp'), () => nudgePower(0.01));
  const fireBtn = $('btnFire');
  fireBtn.addEventListener('pointerdown', e => {
    e.preventDefault(); Sfx.init();
    if (!game) return;
    if (game.torp) fastOn(); else fire();
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => fireBtn.addEventListener(ev, () => { if (game) game.fast = false; }));
  ui.controls.addEventListener('contextmenu', e => e.preventDefault());

  function pause(on) {
    if (!game || game.done) return;
    game.paused = on; game.drag = null; game.fast = false;
    show(ui.pause, on); refreshControls();
  }
  $('btnPlay').onclick = () => { Sfx.init(); Sfx.click(); const next = LEVELS.find(l => !starsOf(l.id)); startLevel(next ? next.id : 1, false); };
  $('btnSelect').onclick = () => { Sfx.init(); Sfx.click(); goSelect(); };
  $('btnMuteTitle').onclick = () => { Sfx.init(); toggleMute(); };
  $('btnBackTitle').onclick = () => { Sfx.click(); goTitle(); };
  $('btnMute').onclick = () => { Sfx.init(); toggleMute(); };
  $('btnRestart').onclick = () => { Sfx.click(); if (game) startLevel(game.id, true); };
  $('btnAwacs').onclick = () => { Sfx.init(); callAwacs(); };
  $('btnScope').onclick = () => { Sfx.init(); autoAim(); };
  $('btnPause').onclick = () => { Sfx.click(); pause(true); };
  $('btnResume').onclick = () => { Sfx.click(); pause(false); };
  $('btnPauseRestart').onclick = () => { Sfx.click(); startLevel(game.id, true); };
  $('btnPauseSelect').onclick = () => { Sfx.click(); goSelect(); };
  $('btnPauseTitle').onclick = () => { Sfx.click(); goTitle(); };
  $('btnVibeTitle').onclick = () => { Sfx.init(); toggleVibe(); };
  $('btnLangTitle').onclick = () => { Sfx.init(); Sfx.click(); toggleLang(); };
  $('btnPauseLang').onclick = () => { Sfx.click(); toggleLang(); };
  $('pcOk').onclick = () => { Sfx.click(); show(ui.card, false); };
  $('btnPauseVibe').onclick = () => { Sfx.click(); toggleVibe(); };

  addEventListener('keydown', e => {
    if (scene !== 'play' || !game) return;
    if (e.key === 'r' || e.key === 'R') startLevel(game.id, true);
    else if (e.key === 'Escape') pause(!game.paused);
    else if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (game.done) { if (e.key === 'Enter' && game.outcome === 'win' && game.id < LEVELS.length) startLevel(game.id + 1, false); }
      else if (game.phase === 'intro') { game.phase = 'aim'; show(ui.intro, false); refreshControls(); refreshHelp(); }
      else if (game.torp) game.fast = true;
      else if (!e.repeat) fire();
    }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); nudgeAngle((e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 0.1 : 0.5)); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); nudgePower((e.key === 'ArrowDown' ? -1 : 1) * 0.01); }
  });
  addEventListener('keyup', e => { if (e.key === ' ' && game) game.fast = false; });
  addEventListener('resize', layout);
  document.addEventListener('visibilitychange', () => { if (document.hidden && game && !game.done && game.phase !== 'intro') pause(true); });

  /* ───────── 启动 ───────── */
  I18N.set(save.lang || I18N.detect()); I18N.applyStatic();
  layout(); muteLabel(); vibeLabel();
  const m = location.search.match(/[?&]lv=(\d+)/);
  if (m && LEVELS[+m[1] - 1]) startLevel(+m[1], false); else goTitle();
  requestAnimationFrame(frame);

  // 调试/自动化测试用
  window.__game = {
    get state() { return game; }, startLevel, awacs: callAwacs, autoAim, fire,
    predict: () => { worldTransform(); drawPrediction(game); return game.predHit; },
    aim: (deg, pw) => setAim(deg * Math.PI / 180, pw),
    launch: (deg, pw) => { game.phase = 'aim'; show(ui.intro, false); launch(deg * Math.PI / 180, pw); },
    step: sec => { for (let i = 0; i < sec * 60 && game && !game.done; i++) updatePlay(1 / 60); },
  };
})();

</script>
</body>
</html>
